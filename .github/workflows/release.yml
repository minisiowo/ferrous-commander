# Pushing a tag such as v0.1.0 builds, tests and publishes a pre-release.
# Started by hand (Actions > Release > Run workflow) it only builds and tests.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # The oldest supported runner, so the program also starts on older systems.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME"
      - run: rustup update stable && rustup default stable
      - run: sudo apt-get update && sudo apt-get install -y build-essential libxkbcommon-dev libgl1-mesa-dev libwayland-dev libasound2-dev acl attr
      - run: cargo test --locked
      - run: sh packaging/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: app/dist/ferrous-commander-linux-*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable; rustup default stable
      - run: cargo test --locked
      - run: choco install innosetup -y --no-progress
      - run: powershell -ExecutionPolicy Bypass -File packaging\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            app/dist/FerrousCommander-windows-x64.zip
            app/dist/FerrousCommander-Setup.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" \
            --title "Ferrous Commander ${GITHUB_REF_NAME#v}" --generate-notes --prerelease
