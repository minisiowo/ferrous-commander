[package]
name = "ferrous-commander"
version = "0.2.1"
edition = "2024"
description = "A fast, light multi-pane file manager with tiled panels and column navigation"
license = "MIT"
authors = ["Ferrous Commander contributors"]

[[bin]]
name = "ferrous-commander"
path = "src/main.rs"

[dependencies]
libc = "0.2"
chrono = "0.4.45"
dirs = "7.0.0"
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wgpu", "clipboard", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico", "tiff", "tga", "pnm", "qoi", "hdr", "dds", "exr"] }
open = "5.4.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.1", default-features = false, features = ["disk"] }
trash = "5.2.9"
# Pure Rust on purpose: nothing to install, and both systems unpack the same way.
bzip2 = "0.6.1"
flate2 = "1.1.10"
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz", "encoder"] }
ruzstd = "0.9.1"
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["aes256", "bzip2", "compress", "deflate", "ppmd"] }
tar = { version = "0.4.46", default-features = false }
zip = { version = "9.4.1", default-features = false, features = ["aes-crypto", "bzip2", "chrono", "deflate-flate2", "deflate64", "lzma", "ppmd", "xz"] }
hayro = "0.9"
resvg = { version = "0.49", default-features = false, features = ["svgz", "text", "system-fonts", "memmap-fonts", "raster-images"] }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
pulldown-cmark = { version = "0.13", default-features = false }
encoding_rs = "0.8"
chardetng = "1"
calamine = "0.38"
lofty = "0.25"
quick-xml = "0.42"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13.2"
x11-dl = "2.21.0"
raw-window-handle = "0.6.2"
winit = { version = "0.30.13", default-features = false, features = ["x11", "wayland"] }
wayland-client = "0.31.15"
wayland-backend = { version = "0.3.17", features = ["client_system"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13.2", features = ["xtest"] }

[target."cfg(windows)".dependencies]
raw-window-handle = "0.6.2"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Linux package: `cargo deb` (cargo install cargo-deb)
[package.metadata.deb]
name = "ferrous-commander"
maintainer = "Ferrous Commander contributors"
section = "utils"
priority = "optional"
assets = [
    ["target/release/ferrous-commander", "usr/bin/", "755"],
    ["packaging/linux/ferrous-commander.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/ferrous-commander.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
]
